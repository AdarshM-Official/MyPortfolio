<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech grid -->
  <g stroke="#312e81" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  
  <!-- Glowing rings -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#glowGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="200" cy="180" r="95" fill="#1e293b" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Sleek Avatar Head & Shoulders Silhouette -->
  <path d="M200 120 C182 120, 168 134, 168 152 C168 170, 182 184, 200 184 C218 184, 232 170, 232 152 C232 134, 218 120, 200 120 Z" fill="#e2e8f0"/>
  <path d="M142 248 C142 208, 168 198, 200 198 C232 198, 258 208, 258 248 Z" fill="#94a3b8"/>

  <!-- Code brackets badge -->
  <rect x="130" y="300" width="140" height="34" rx="17" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="200" y="322" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle">Adarsh M</text>
</svg>
